server.port=${PORT:8081}

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nihal}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

app.jwt.secret=HRMS-Secret-Key-For-Production-Use-Replace-With-Strong-Key
app.jwt.expirationMs=86400000

logging.level.org.springframework.security=INFO
logging.level.com.hrms=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
